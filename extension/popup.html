<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="hd">网申助手 Copilot</div>

<div class="sec">
  <div class="ttl">当前网页</div>
  <div id="siteStatus" class="hint">正在检查当前网页权限…</div>
  <button id="enableSite" class="btn">在当前网站启用填表助手</button>
</div>

<div class="sec">
  <div class="ttl">我的档案（保存在本地后端）</div>
  <input id="profileName" placeholder="姓名 / Full name">
  <input id="profileFamilyName" placeholder="姓 / Family name（分字段表单可选）">
  <input id="profileGivenName" placeholder="名 / Given name（分字段表单可选）">
  <input id="profileEmail" type="email" placeholder="邮箱">
  <input id="profilePhone" type="tel" placeholder="手机">
  <input id="profileSchool" placeholder="学校">
  <input id="profileDegree" placeholder="学历 / 学位">
  <input id="profileMajor" placeholder="专业">
  <button id="saveProfile" class="btn">保存档案</button>
  <div id="profileStatus" class="hint"></div>
</div>

<div class="sec">
  <div class="ttl">① 当前目标公司</div>
  <select id="company" class="sel"></select>
  <button id="setTarget" class="btn">设为当前目标</button>
  <div id="curTarget" class="hint"></div>
</div>

<div class="sec">
  <div class="ttl">② 简历匹配（粘 JD）</div>
  <textarea id="jd" placeholder="把岗位 JD 粘进来，点匹配看推荐投哪份简历"></textarea>
  <button id="matchBtn" class="btn alt">匹配简历</button>
  <div id="matchOut" class="out"></div>
</div>

<div class="sec">
  <div class="ttl">③ 已注册简历</div>
  <div id="resumes" class="out"></div>
</div>

<div class="sec">
  <div class="ttl">④ 快捷</div>
  <button id="openDash" class="btn gray">打开投递队列仪表板</button>
  <button id="openTarget" class="btn">打开目标公司网申页</button>
</div>

<div id="toast" class="toast"></div>
<script src="popup.js"></script>
</body>
</html>
