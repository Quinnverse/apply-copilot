<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>校招申请表</title></head>
<body>
<h1>校园招聘申请表</h1>
<form>
  <label for="name">姓名</label><input id="name" name="name" type="text"><br>
  <label for="mobile">手机</label><input id="mobile" name="mobile" type="tel"><br>
  <label for="email">电子邮箱</label><input id="email" name="email" type="email"><br>
  <label>毕业院校 <input name="school" type="text"></label><br>
  <label>专业 <input name="major" type="text"></label><br>
  <label>最高学历
    <select name="degree">
      <option value="">请选择</option>
      <option value="本科">本科</option>
      <option value="硕士">硕士</option>
      <option value="博士">博士</option>
    </select>
  </label><br>
  <label>政治面貌 <input name="political" type="text"></label><br>
  <label for="self">自我介绍</label><textarea id="self" name="self"></textarea><br>
  <button type="submit">提交</button>
</form>
</body>
</html>
