# Install only after the certificate for apply.quinnverse.tech exists.
server {
    listen 80;
    server_name apply.quinnverse.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name apply.quinnverse.tech;
    ssl_certificate /etc/letsencrypt/live/apply.quinnverse.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apply.quinnverse.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
