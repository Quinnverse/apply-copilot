# Temporary hold while apply.quinnverse.tech has no valid HTTPS certificate.
# Keep ACME HTTP validation available; never proxy application data over HTTP.
server {
    listen 80;
    server_name apply.quinnverse.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 503;
    }
}
